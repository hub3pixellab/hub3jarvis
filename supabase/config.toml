project_id = "spb-t4ng9l0640q82en1"

# create-checkout-session is called by the browser through the client SDK,
# which always sends a valid JWT (the user's session or the anon key).
[functions.create-checkout-session]
verify_jwt = true

# stripe-webhook receives unsigned requests from Stripe. The signature is
# verified inside the function with constructEventAsync + STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false

# sign-match é público: alimenta o widget de marketing (combinação de signos)
# que pode ser embutido em páginas sem login. O resultado é cacheado por
# par+idioma, então a IA só gera cada combinação uma única vez.
[functions.sign-match]
verify_jwt = false
