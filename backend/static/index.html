<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Agnes</title>
<style>
  :root { --bg:#0b0e14; --panel:#11151f; --borda:#232a3b; --texto:#d6ddeb; --roxo:#a78bfa; --verde:#9ae6b4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--texto); font-family:'SF Mono',Menlo,Consolas,monospace; height:100vh; display:flex; }
  #chat { flex:1; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:10px; }
  header .ponto { width:10px; height:10px; border-radius:50%; background:var(--verde); box-shadow:0 0 8px var(--verde); }
  header h1 { font-size:15px; color:var(--roxo); }
  header span { font-size:11px; color:#6b7280; }
  #mensagens { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.5; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .agente { align-self:flex-start; background:var(--panel); border:1px solid var(--borda); }
  .usuario { align-self:flex-end; background:var(--roxo); color:#fff; }
  .sistema { align-self:center; background:#1a2030; color:#8b95a8; font-size:11px; border:1px dashed var(--borda); }
  #rodape { border-top:1px solid var(--borda); padding:12px 16px; display:flex; gap:10px; align-items:center; }
  #entrada { flex:1; background:var(--panel); border:1px solid var(--borda); color:var(--texto); padding:10px 12px; border-radius:8px; outline:none; font-family:inherit; font-size:13px; }
  #entrada:focus { border-color:var(--roxo); }
  button { background:var(--roxo); color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px; }
  button:hover { opacity:.85; }
  #enviarArquivo { background:#2a3246; }
</style>
</head>
<body>
<div id="chat">
  <header><div class="ponto"></div><h1>Terminal Agnes</h1><span>— astrologia &amp; numerologia</span></header>
  <div id="mensagens"></div>
  <div id="rodape">
    <input type="file" id="certidao" accept=".pdf" hidden>
    <button id="enviarArquivo">Certidao PDF</button>
    <input id="entrada" placeholder="Pergunte para a Agnes..." autocomplete="off">
    <button id="enviar">Enviar</button>
  </div>
</div>
<script>
var chave = "agnes-secreta-2026";
var caixa = document.getElementById("mensagens");
var entrada = document.getElementById("entrada");
var certidaoInput = document.getElementById("certidao");

function adicionar(quem, texto) {
  var d = document.createElement("div");
  d.className = "msg " + quem;
  d.textContent = texto;
  caixa.appendChild(d);
  caixa.scrollTop = caixa.scrollHeight;
  return d;
}

async function enviarMensagem(texto) {
  if (!texto.trim()) return;
  entrada.value = "";
  adicionar("usuario", texto);
  var carregando = adicionar("sistema", "Agnes esta pensando...");
  try {
    var r = await fetch("/api/agnes/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": chave },
      body: JSON.stringify({ mensagem: texto })
    });
    var d = await r.json();
    carregando.remove();
    if (d.resposta) adicionar("agente", d.resposta);
    else adicionar("sistema", "Erro: " + JSON.stringify(d));
  } catch (e) {
    carregando.remove();
    adicionar("sistema", "Falha de conexao: " + e);
  }
}

document.getElementById("enviar").onclick = function () { enviarMensagem(entrada.value); };
entrada.addEventListener("keydown", function (e) { if (e.key === "Enter") enviarMensagem(entrada.value); });

document.getElementById("enviarArquivo").onclick = function () { certidaoInput.click(); };
certidaoInput.addEventListener("change", async function () {
  var arquivo = certidaoInput.files[0];
  if (!arquivo) return;
  adicionar("usuario", "[Certidao enviada: " + arquivo.name + "]");
  var carregando = adicionar("sistema", "Agnes esta lendo a certidao...");
  var form = new FormData();
  form.append("arquivo", arquivo);
  try {
    var r = await fetch("/api/agnes/upload/certidao", {
      method: "POST",
      headers: { "x-api-key": chave },
      body: form
    });
    var d = await r.json();
    carregando.remove();
    if (d.relatorio) {
      adicionar("sistema", "Dados extraidos: " + d.dados_extraidos.nome + " | nascimento " + d.dados_extraidos.data_nascimento + " | signo " + d.dados_extraidos.signo);
      adicionar("agente", d.relatorio);
    } else {
      adicionar("sistema", "Erro: " + JSON.stringify(d));
    }
  } catch (e) {
    carregando.remove();
    adicionar("sistema", "Falha de conexao: " + e);
  }
});
</script>
</body>
</html>
